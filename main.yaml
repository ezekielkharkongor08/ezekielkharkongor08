name: Metrics

on:
  workflow_dispatch:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ezekielkharkongor08
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Kolkata

          # Language breakdown as a distinct donut/list, not the generic vercel card
          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # Circular year calendar — visually unique, not the standard green grid
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits / activity patterns
          plugin_habits: yes
          plugin_habits_charts_type: bars
          plugin_habits_facts: yes

          output_action: commit
          committer_message: "Update GitHub metrics"
          filename: github-metrics.svg
